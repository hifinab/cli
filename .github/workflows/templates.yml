name: Templates

on:
  push:
    paths:
      - "templates/**"
      - "templates*.go"
  pull_request:
    paths:
      - "templates/**"
      - "templates*.go"

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate every built-in template and run its make check
        env:
          HI_TEMPLATE_CHECK: "1"
        run: go test -run 'Template|Fragment|Compose' -v .
