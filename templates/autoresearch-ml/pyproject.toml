[project]
name = "hifin-template-name"
version = "0.1.0"
description = "Hifin Template Name"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3",
    "pytest>=9.1",
    "ruff>=0.16",
]
# One PyTorch build per machine: `make sync` picks it (see the Makefile).
# rocm is AMD's build for Strix Halo (gfx1151), with its own ROCm libraries.
cpu = ["torch>=2.14"]
cuda = ["torch>=2.14"]
rocm = [
    "rocm",
    "rocm-sdk-core",
    "rocm-sdk-libraries-gfx1151",
    "torch>=2.11",
    "triton",
]

[tool.uv]
# The experiment is a few scripts, not a package.
package = false
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }, { group = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cuda", group = "cuda" },
    { index = "pytorch-rocm", group = "rocm" },
]
rocm = [{ index = "pytorch-rocm", group = "rocm" }]
rocm-sdk-core = [{ index = "pytorch-rocm", group = "rocm" }]
rocm-sdk-libraries-gfx1151 = [{ index = "pytorch-rocm", group = "rocm" }]
triton = [{ index = "pytorch-rocm", group = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://repo.amd.com/rocm/whl/gfx1151/"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["*.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
