[project]
name = "hifin-template-name"
version = "0.1.0"
description = "Hifin Template Name"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    # make results writes Parquet; the tests check it.
    "pyarrow>=22",
    "pyrefly>=1.3",
    "pytest>=9.1",
    "ruff>=0.16",
]
# Only make data needs it, on this machine; boxes never download prices.
data = ["yfinance>=1.0"]

[tool.uv]
# The experiment is a few scripts, not a package.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["*.py", "tests"]
# yfinance is in the data group, which only make data installs.
ignore-missing-imports = ["yfinance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
