[project]
name = "hifin-template-name"
version = "0.1.0"
description = "Hifin Template Name"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
hifin-template-name = "hifin_template_name.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=1.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
